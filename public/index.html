<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Extract-Tiles Viewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body, #app {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    #loading {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 100, 200, 0.8);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      display: none;
    }
    #loading.active {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js",
      "three/examples/jsm/loaders/GLTFLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js",
      "dat.gui": "https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    Tiles: <span id="tiles">0</span> |
    Cache: <span id="cache">0</span>
  </div>
  <div id="loading">Loading tiles...</div>

</html>
